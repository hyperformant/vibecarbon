#cloud-config
# Vibecarbon compose-deploy bootstrap.
#
# This user-data runs at VPS boot time in parallel with Hetzner's default
# docker-ce app (Ubuntu 24.04 with Docker + compose-plugin pre-installed).
# By finishing UFW + unattended-upgrades before SSH is even reachable, the
# CLI's post-SSH setupServer becomes a ~2-second marker-file probe instead
# of a ~90-second serial apt-get chain.
#
# Writing the marker file `/var/lib/vibecarbon/ready` is the contract that
# tells the CLI it's safe to proceed. If user-data fails, the marker never
# appears; the CLI reports and dumps /var/log/cloud-init-output.log.

# ufw and unattended-upgrades install in runcmd, AFTER Docker is up and the
# boot image pull has started, so Docker (and the pull) start as early as the
# boot allows instead of waiting for these packages.
package_update: true

write_files:
  # The boot image pull: the pinned core images (the db image, the traefik and
  # docker-socket-proxy mirrors; the CLI fills the list from src/lib/images.js,
  # the same refs the compose files use) pulled in the background while the
  # rest of boot runs, so the deploy's own `docker compose pull --policy
  # missing` finds them present. Never waited on and never retried: if a pull
  # fails, the deploy's pull does the work, loud on failure as always, and the
  # deploy log quotes what this one reported (status + log below).
  - path: /usr/local/lib/vibecarbon/boot-pull.sh
    permissions: '0755'
    content: |
      #!/bin/sh
      out=/var/lib/vibecarbon/boot-pull
      mkdir -p "$out"
      echo running > "$out/status"
      : > "$out/log"
      pids=""
      for ref in __VIBECARBON_BOOT_PULL_IMAGES__; do
        docker pull -q "$ref" >> "$out/log" 2>&1 &
        pids="$pids $!"
      done
      failed=0
      for pid in $pids; do
        wait "$pid" || failed=$((failed + 1))
      done
      if [ "$failed" -eq 0 ]; then
        echo ok > "$out/status"
      else
        echo "failed: $failed image(s), $(tail -n 1 "$out/log")" > "$out/status"
      fi

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  # Bound Docker's json-file logs at the DAEMON level so every container the
  # deploy later starts inherits the cap - no per-service logging block needed.
  # Without this, a chatty container grows /var/lib/docker/containers/*/*.log
  # without limit until the single-VPS root disk fills and the whole stack
  # wedges (slow disk-fill outage). 10m x 3 files = 30MB/container ceiling.
  # A fresh Ubuntu + docker-ce app ships no daemon.json, so this is a create,
  # not a merge; if that ever changes, fold these keys into the existing file.
  - path: /etc/docker/daemon.json
    permissions: '0644'
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }

  # sshd connection-concurrency headroom. Ubuntu's default MaxStartups
  # 10:30:100 probabilistically DROPS unauthenticated connections beyond 10
  # concurrent - and a vibecarbon deploy legitimately fans builds (BuildKit
  # dials several ssh streams), image pulls, admin tunnels, and verification
  # probes at exactly that scale, concurrently, per node. On slow provider
  # links each connection sits unauthenticated longer, so the burst overlaps
  # harder: three subsystems on one linode leg died with
  # `kex_exchange_identification: read: Connection reset by peer`
  # (2026-08-23, runs 32640636398/32642715052) before this existed. These are
  # our nodes; provision them for our workload.
  - path: /etc/ssh/sshd_config.d/99-vibecarbon-concurrency.conf
    permissions: '0644'
    content: |
      MaxStartups 100:30:200
      MaxSessions 64

runcmd:
  # Docker first (a provider that installs it splices that install above this
  # line). Ensure it is running and restart it so it picks up
  # /etc/docker/daemon.json written above: write_files runs before runcmd, but
  # the docker-ce app has usually already started the daemon with the OLD
  # config, so `enable --now` alone would leave the log cap unapplied. The
  # restart is cheap here - no containers exist yet at boot. Nothing below
  # restarts Docker again, so the boot pull started next never races a restart.
  - [systemctl, enable, --now, docker]
  - [systemctl, restart, docker]
  # The boot image pull, detached so it overlaps the rest of boot and never
  # holds the ready marker.
  - [sh, -c, 'setsid nohup /usr/local/lib/vibecarbon/boot-pull.sh > /dev/null 2>&1 < /dev/null &']

  # Pick up the sshd drop-in written above (write_files runs first; ssh is
  # already up serving cloud-init's own channel, so reload - never restart,
  # which would sever the session provisioning us).
  - [systemctl, reload, ssh]
  # UFW and unattended-upgrades, now that Docker and the pull are going.
  # Lock timeout, not bare apt-get: unattended-upgrades may hold dpkg's lock
  # on first boot (src/lib/deploy/apt.js).
  - [sh, -c, 'apt-get -o DPkg::Lock::Timeout=300 install -y ufw unattended-upgrades']
  # UFW defaults + the three ports Traefik needs. Ordering matters: we enable
  # last so the allow rules are in place before the first policy flip.
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, '22/tcp']
  - [ufw, allow, '80/tcp']
  - [ufw, allow, '443/tcp']
  - [sh, -c, 'echo y | ufw enable']

  # History: an earlier boot pull (iter-perfwave4b 2026-05-06) ran in the
  # foreground against Docker Hub and was reverted: Hetzner DC IPs hit Docker
  # Hub's per-IP rate limit, and the marker waited for it (cloudInitReady
  # +61s). Today's differs on both counts: the core images come from the
  # public ghcr mirror (src/lib/images.js MIRRORED_IMAGES), and the pull is
  # detached, so it never holds the marker.

  # Marker file - the CLI's setupServer polls for this. The parent dir may
  # not exist yet on a first boot; mkdir -p is safe either way.
  - [mkdir, -p, /var/lib/vibecarbon]
  - [sh, -c, 'printf "%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /var/lib/vibecarbon/ready']

final_message: "vibecarbon cloud-init complete after $UPTIME seconds"
