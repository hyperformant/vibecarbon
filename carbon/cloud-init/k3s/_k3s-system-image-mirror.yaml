  # k3s system images from our ghcr mirror, spliced into every role's
  # registries.yaml by loadCloudInit's include directive (one copy, six
  # scripts). The master runs k3s with --system-default-registry
  # vibecarbon-system.invalid (K3S_SYSTEM_REGISTRY in src/lib/images.js;
  # agents inherit it), so k3s names coredns, local-path-provisioner,
  # metrics-server, the local-path helper and pause under that alias, and
  # this is the only mirror that reaches them: each rewrite lands on
  # ghcr.io/hyperformant/<basename>, mirrored by publish-images.yml from
  # K3S_SYSTEM_IMAGE_MIRRORS. The alias never resolves (.invalid), so there
  # is no fallback: a missing mirror fails the pull, loudly.
  # Deliberately NOT a docker.io mirror: that would try every docker.io pull
  # as ghcr.io with the same org and name first (namespace confusion).
  # No capture groups, backticks or dollar-variables anywhere in this file:
  # the DigitalOcean scripts write it through an UNQUOTED heredoc, where the
  # shell would expand them. A dollar sign followed by a quote stays literal.
  "vibecarbon-system.invalid":
    endpoint:
      - "https://ghcr.io"
    rewrite:
      "^rancher/mirrored-coredns-coredns$": "hyperformant/mirrored-coredns-coredns"
      "^rancher/local-path-provisioner$": "hyperformant/local-path-provisioner"
      "^rancher/mirrored-metrics-server$": "hyperformant/mirrored-metrics-server"
      "^rancher/mirrored-library-busybox$": "hyperformant/mirrored-library-busybox"
      "^rancher/mirrored-pause$": "hyperformant/mirrored-pause"
