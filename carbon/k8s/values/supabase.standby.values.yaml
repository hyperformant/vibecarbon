# Pilot-light standby overlay (spec: 2026-07-16-pilot-light-standby-design).
# Passed as a SECOND `-f` by installSupabase ONLY when role=standby. Its job
# is to render every chart Deployment at 0 replicas (the 2-node floor has no
# capacity for app-tier pods, and anything Pending would hang `helm --wait`)
# and to disable persistence for every chart PVC whose only consumer is a
# zeroed Deployment (WaitForFirstConsumer + 0 consumers = Pending forever).
# The db StatefulSet stays at 1.
#
# Today the chart renders NO Deployment and no PVC beyond the db's own
# (supabase.values.yaml disables every other component), so there is nothing
# to zero and both maps are empty. The app's own Deployment is zeroed by the
# deploy itself, not by this file.
#
# ONLY scalar keys belong here (chart >= 0.7.1 replaces LISTS wholesale —
# an env list in this file would wipe the primary defaults).
# Drift guard: tests/unit/deploy/standby-overlay-drift.test.ts against
# tests/fixtures/supabase-chart-workloads.json (regen on pin bump).
deployment: {}
persistence: {}
