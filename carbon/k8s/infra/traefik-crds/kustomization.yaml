apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Traefik CRDs for IngressRoute, Middleware, etc.
# Apply this BEFORE base manifests that use Traefik CRs
# Usage: kubectl apply -k k8s/infra/traefik-crds/

# LOCKSTEP: the tag below is the Traefik tag this deploy runs. Traefik floats
# with the version channel, so the CLI deploy and deploy.yml fill it in from the
# same resolved set as the Traefik image (traefikVersion, src/lib/images.js), and
# this file cannot be applied as it stands.
# tests/unit/template/traefik-crd-version.test.ts holds the lockstep.
#
# Why it matters: the CRDs define the schema the API server validates against,
# so anything newer than the CRD tag is silently PRUNED from an IngressRoute or
# Middleware rather than rejected. This sat at v3.3.6 while Traefik ran v3.6.11
# — same 10 CRD kinds, but the v3.3.6 schemas are ~700 lines shorter, so every
# field added in 3.4-3.6 was being dropped without an error.
resources:
  # Traefik v3 CRDs from official repository
  - https://raw.githubusercontent.com/traefik/traefik/{{TRAEFIK_VERSION}}/docs/content/reference/dynamic-configuration/kubernetes-crd-definition-v1.yml
