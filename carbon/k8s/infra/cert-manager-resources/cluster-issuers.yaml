# Let's Encrypt ClusterIssuers: the one issuer pair every k8s deploy uses.
#
# HTTP-01 validation: cert-manager exposes a challenge token at
# http://<domain>/.well-known/acme-challenge/<token> through the Traefik
# ingress class, and Let's Encrypt fetches it to prove control. Port 80 must
# reach Traefik from the public internet, so the names must resolve to this
# cluster (a record set the CLI manages) and no proxy may sit in front.
# HTTP-01 cannot issue wildcards: the Certificate lists explicit names.
#
# applyK3sManifests (src/lib/deploy/k8s/k3s.js, pickIssuerName) picks
# `letsencrypt-staging` when ACME_CA_SERVER names the staging directory,
# `letsencrypt-prod` otherwise.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "{{ADMIN_EMAIL}}"
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Staging has higher rate limits but issues untrusted certs.
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: "{{ADMIN_EMAIL}}"
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
