apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# cert-manager custom resources (the Let's Encrypt ClusterIssuers).
# IMPORTANT: Apply this AFTER cert-manager CRDs are installed and ready.
# Usage: kubectl apply -k k8s/infra/cert-manager-resources/
#
# Both issuers ship together; cert-manager only acts on the one referenced
# by the Certificate (issuerRef.name is patched per deployment in
# src/lib/deploy/k8s/k3s.js -> applyK3sManifests).
#
# Every ClusterIssuer file in this directory must be listed: an unlisted file
# never applies, and the Certificate that references its issuer sits Pending
# with no error. Guarded by tests/integration/template/manifest-dry-run.test.ts.
resources:
  - cluster-issuers.yaml
  # Non-ACME: the pilot-standby's contention-free issuer (single-ACME-issuer
  # policy — see cluster-issuer-standby-selfsigned.yaml's header).
  - cluster-issuer-standby-selfsigned.yaml
