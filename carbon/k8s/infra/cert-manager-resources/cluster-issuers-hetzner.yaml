# Let's Encrypt ClusterIssuers for the `hetzner` DNS provider strategy.
#
# Uses cert-manager's webhook solver pointed at the OFFICIAL
# `cert-manager-webhook-hetzner` chart from charts.hetzner.cloud. The
# webhook calls the Hetzner Cloud DNS API (api.hetzner.cloud/v1/zones)
# to write the `_acme-challenge.<domain>` TXT record.
#
# Hetzner retired the separate DNS Console (dns.hetzner.com) in
# May 2026 and folded zone management into the main Cloud Console.
# As a result the same Cloud API token used elsewhere in vibecarbon
# now covers DNS — there is NO separate "DNS API token" anymore.
#
# Requires:
#   1. The cert-manager-webhook-hetzner Deployment to be Available in
#      the cert-manager namespace (installed by applyK3sManifests via
#      `helm upgrade --install` from charts.hetzner.cloud).
#   2. Secret `hetzner` with key `token` in the cert-manager namespace,
#      holding the Hetzner Cloud API token. `applyK3sManifests` lands
#      both before applying these issuers.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-hetzner
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "{{ADMIN_EMAIL}}"
    privateKeySecretRef:
      name: letsencrypt-prod-hetzner-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.hetzner.com
            solverName: hetzner
            config:
              tokenSecretKeyRef:
                name: hetzner
                key: token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging-hetzner
spec:
  acme:
    # Staging has higher rate limits but issues untrusted certs.
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: "{{ADMIN_EMAIL}}"
    privateKeySecretRef:
      name: letsencrypt-staging-hetzner-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.hetzner.com
            solverName: hetzner
            config:
              tokenSecretKeyRef:
                name: hetzner
                key: token
