# Local development configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: vibecarbon-config
data:
  # Site Configuration (local URLs)
  SITE_URL: "http://localhost:8080"
  PROJECT_NAME: "vibecarbon-local"

  # Database. STALE OVERLAY: kustomization.yaml still lists the hand-written
  # base/supabase/* manifests (removed when deploys moved to the Supabase Helm
  # chart), so `kubectl kustomize overlays/local` does not build. "postgres"
  # (like kong below) names that overlay's own former services. Real
  # deploys use base + the chart, whose db Service is supabase-supabase-db.
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "postgres"

  # Internal Service URLs
  KONG_URL: "http://kong:8000"
  REST_URL: "http://rest:3000"
  REALTIME_URL: "http://realtime:4000"
  META_URL: "http://meta:8080"
