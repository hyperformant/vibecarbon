apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vibecarbon

resources:
  - ../../base

labels:
  - pairs:
      environment: production

configMapGenerator:
  - name: vibecarbon-config
    behavior: merge
    literals:
      - SITE_URL={{DOMAIN}}
      - PROJECT_NAME=vibecarbon
      # The `db` Service in front of the db StatefulSet (base/db/service.yaml).
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=postgres

images:
  - name: ghcr.io/{{GITHUB_OWNER}}/{{PROJECT_NAME}}
    newTag: main
