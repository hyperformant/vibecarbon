apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vibecarbon

resources:
  - ../../base

labels:
  - pairs:
      environment: production

configMapGenerator:
  - name: vibecarbon-config
    behavior: merge
    literals:
      - SITE_URL={{DOMAIN}}
      - PROJECT_NAME=vibecarbon
      # Service names follow the Supabase community Helm chart convention
      # (release name `supabase` + chart name `supabase` → `supabase-supabase-*`).
      - DB_HOST=supabase-supabase-db
      - DB_PORT=5432
      - DB_NAME=postgres
      - KONG_URL=http://supabase-supabase-kong:8000
      - REST_URL=http://supabase-supabase-rest:3000
      - REALTIME_URL=http://supabase-supabase-realtime:4000
      - META_URL=http://supabase-supabase-meta:8080

images:
  - name: ghcr.io/{{GITHUB_OWNER}}/{{PROJECT_NAME}}
    newTag: main
