---
# Flux GitRepository + Kustomizations for the standby cluster (HA setup).
#
# Mirror of clusters/primary/vibecarbon.yaml. The standby runs the same base
# resources; its db StatefulSet streams from the primary's, and its app tier
# stays at zero replicas until a failover. The path layout + templating is
# identical.
#
# Applied once by the deploy workflow at first standby-cluster bootstrap.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vibecarbon
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/{{GITHUB_OWNER}}/{{PROJECT_NAME}}
  ref:
    branch: main
  secretRef:
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vibecarbon-base
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: vibecarbon
  sourceRef:
    kind: GitRepository
    name: vibecarbon
  path: ./k8s/base
  prune: true
  # No `wait: true`: Flux ignores `healthChecks` when wait is on, and the
  # db StatefulSet below is not in this Kustomization's own inventory (see
  # `patches`), so `wait` alone would never look at the database. The
  # explicit list covers every workload base runs on this cluster.
  timeout: 10m
  # The db StatefulSet stays with the vibecarbon CLI's deploy, which renders
  # its per-cluster values (image, StorageClass, S3 endpoint, wal-g role,
  # relay address; see k8s/base/db/statefulset.yaml). Flux would apply the
  # unrendered placeholders, so it drops the object from its build here and
  # only health-checks the live one. Its Services and NetworkPolicy carry no
  # placeholders and stay in Flux's hands.
  patches:
    - patch: |
        $patch: delete
        apiVersion: apps/v1
        kind: StatefulSet
        metadata:
          name: db
      target:
        kind: StatefulSet
        name: db
    # The registry's hostPort binds {{MASTER_PRIVATE_IP}}, rendered per
    # cluster by the CLI's deploy (renderK8sBase), so the CLI owns this
    # Deployment like the db. Its Service and NetworkPolicy stay with Flux.
    - patch: |
        $patch: delete
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: local-registry
      target:
        kind: Deployment
        name: local-registry
  healthChecks:
    # The app tier is zeroed on a pilot-light standby, so only the database
    # and the platform pieces it keeps running are checked.
    - apiVersion: apps/v1
      kind: StatefulSet
      name: db
      namespace: vibecarbon
    - apiVersion: apps/v1
      kind: Deployment
      name: traefik
      namespace: vibecarbon
    - apiVersion: apps/v1
      kind: Deployment
      name: local-registry
      namespace: vibecarbon
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vibecarbon-cert-manager-webhook-hetzner
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: flux-system
  sourceRef:
    kind: GitRepository
    name: vibecarbon
  path: ./k8s/gitops/cert-manager-webhook-hetzner
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: vibecarbon-base
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager-webhook-hetzner
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vibecarbon-production-hel1
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: vibecarbon
  sourceRef:
    kind: GitRepository
    name: vibecarbon
  path: ./k8s/overlays/production-hel1
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: vibecarbon-base
