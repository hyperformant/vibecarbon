apiVersion: v1
kind: ServiceAccount
metadata:
  name: vibecarbon-app
# Pull secrets are attached to the `default` SA by deploy.js at runtime
# (dockerhub-pull-secret for Docker Hub images, ghcr-pull-secret for the app
# image). This app SA inherits the same set so the app Deployment — which
# uses serviceAccountName: vibecarbon-app — can pull the private ghcr image.
imagePullSecrets:
  - name: dockerhub-pull-secret
  - name: ghcr-pull-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vibecarbon-app-logs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vibecarbon-app-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vibecarbon-app-logs
subjects:
  - kind: ServiceAccount
    name: vibecarbon-app
    namespace: vibecarbon
---
# Read-only view of the nodes, so the app can say which need a restart (each
# node's vibecarbon.dev/host-state annotation). Nodes are cluster-scoped, so
# this is a ClusterRole; it grants nothing but list on nodes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vibecarbon-app-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vibecarbon-app-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vibecarbon-app-nodes
subjects:
  - kind: ServiceAccount
    name: vibecarbon-app
    namespace: vibecarbon
