apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metabase-plugins-pvc
  labels:
    app: metabase
  # The CLI's deploy owns this claim: {{K8S_STORAGE_CLASS}} is rendered per
  # cluster, and Flux drops every claim from its build (flux/clusters/*).
  # prune: disabled keeps Flux's garbage collection off it too.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  # See services/redis/k8s/pvc.yaml: unpinned, the DefaultStorageClass
  # admission plugin chooses between the cluster's TWO default-annotated
  # classes by creationTimestamp, so this can silently land on node-local
  # disk. Resolved before apply by renderK8sStorageClassPlaceholder
  # (storageClassName is immutable once the PVC exists).
  # Quoted: Flux builds k8s/base as it is before it drops this claim, and
  # unquoted the token reads as a YAML map that fails the whole build.
  storageClassName: "{{K8S_STORAGE_CLASS}}"
  resources:
    requests:
      storage: 1Gi
