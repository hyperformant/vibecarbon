apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metabase-plugins-pvc
  labels:
    app: metabase
spec:
  accessModes:
    - ReadWriteOnce
  # See services/redis/k8s/pvc.yaml: unpinned, the DefaultStorageClass
  # admission plugin chooses between the cluster's TWO default-annotated
  # classes by creationTimestamp, so this can silently land on node-local
  # disk. Resolved before apply by renderK8sStorageClassPlaceholder
  # (storageClassName is immutable once the PVC exists).
  storageClassName: {{K8S_STORAGE_CLASS}}
  resources:
    requests:
      storage: 1Gi
