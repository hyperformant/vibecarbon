apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  labels:
    app: vibecarbon-n8n
    component: automation
  # The CLI's deploy owns this claim: {{K8S_STORAGE_CLASS}} is rendered per
  # cluster, and Flux drops every claim from its build (flux/clusters/*).
  # prune: disabled keeps Flux's garbage collection off it too.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  # Quoted: Flux builds k8s/base as it is before it drops this claim, and
  # unquoted the token reads as a YAML map that fails the whole build.
  storageClassName: "{{K8S_STORAGE_CLASS}}"
  resources:
    requests:
      storage: 5Gi
