name: E2E Residue Audit

# Weekly, strictly read-only: inventories every e2e provider account and
# reports anything test-shaped that was left behind. A red run is the alert
# (GitHub mails the scheduled workflow's owner). Nothing here deletes.
#   exit 1  residue found (the step summary lists it)
#   exit 2  an inventory was incomplete, so a clean result cannot be claimed
# Output is public: only test-shaped names are ever printed.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: e2e-infra
    concurrency:
      group: e2e-residue-audit
      cancel-in-progress: false
    env:
      # Names the CI state bucket's namespace so the audit finds both state
      # buckets (the CI one and, by namespace swap, the local one).
      E2E_NAMESPACE: ci
      VC_E2E_STATE_BUCKET: ${{ vars.VC_E2E_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Audit provider accounts (read-only)
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          HETZNER_ACCESS_KEY: ${{ secrets.HETZNER_ACCESS_KEY }}
          HETZNER_SECRET_KEY: ${{ secrets.HETZNER_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DIGITALOCEAN_API_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
          DIGITALOCEAN_ACCESS_KEY: ${{ secrets.DIGITALOCEAN_ACCESS_KEY }}
          DIGITALOCEAN_SECRET_KEY: ${{ secrets.DIGITALOCEAN_SECRET_KEY }}
          LINODE_API_TOKEN: ${{ secrets.LINODE_API_TOKEN }}
          LINODE_ACCESS_KEY: ${{ secrets.LINODE_ACCESS_KEY }}
          LINODE_SECRET_KEY: ${{ secrets.LINODE_SECRET_KEY }}
          LINODE_STORAGE_REGION: ${{ secrets.LINODE_STORAGE_REGION }}
          VULTR_API_TOKEN: ${{ secrets.VULTR_API_TOKEN }}
          VULTR_ACCESS_KEY: ${{ secrets.VULTR_ACCESS_KEY }}
          VULTR_SECRET_KEY: ${{ secrets.VULTR_SECRET_KEY }}
          VULTR_STORAGE_REGION: ${{ secrets.VULTR_STORAGE_REGION }}
          SCALEWAY_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
          SCALEWAY_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          SCALEWAY_DEFAULT_PROJECT_ID: ${{ secrets.SCALEWAY_DEFAULT_PROJECT_ID }}
        run: npx tsx tests/e2e/audit-residue.ts
