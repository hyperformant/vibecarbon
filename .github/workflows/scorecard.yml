# OpenSSF Scorecard — automated supply-chain / repo-hygiene analysis.
# Publishes results to the public Scorecard API (that powers the README
# badge) and uploads a SARIF copy to GitHub code scanning.
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the SARIF results to code scanning.
      security-events: write
      # Needed to publish results so the public badge stays current.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
