name: publish-db-image-dev
# The db image's DEV CHANNEL: every branch push that changes the image's
# inputs publishes a build to ghcr.io/hyperformant/postgres-dev, so a branch
# can be tested on real infrastructure before merge without touching the
# release package (ghcr.io/hyperformant/postgres, publish-db-image.yml only).
#
# Tag: <DB_IMAGE_TAG>-<sha12>, where sha12 is the first 12 hex digits of the
# LAST COMMIT THAT TOUCHED THE IMAGE INPUTS (the pathspec below), not of the
# pushed head. A later commit that only touches src/ keeps the same dev tag,
# so the e2e harness (tests/e2e/utils/db-image-select.js, same pathspec) finds
# the image at any HEAD of the branch. A tag that already exists is never
# rebuilt or moved: every dev tag is immutable.
#
# Selected only by VIBECARBON_DB_IMAGE (src/lib/images.js resolveDbImage);
# nothing picks it by default. Versions older than 14 days are deleted by
# cleanup-db-image-dev.yml.
#
# NEVER on pull_request / pull_request_target: a fork's code must not run
# with packages: write. Guarded by tests/unit/deploy/workflow-platforms.test.ts.
#
# Not on dependabot/** either: Dependabot pushes run with a read-only token
# and no Actions secrets, so every docker/postgres-walg bump went red here.
# Those bumps are superseded by hand with the tag edit, which runs this.
on:
  push:
    branches-ignore: [main, 'dependabot/**']
    paths:
      - 'docker/postgres-walg/**'
      - 'docker/wal-g/**'
      - 'src/lib/images.js'
      - '!docker/postgres-walg/README.md'
      - '!docker/wal-g/README.md'
  workflow_dispatch: {}
# Job-scoped writes only (OpenSSF Scorecard Token-Permissions).
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read   # see whether the dev tag already exists (the package may still be private)
    outputs:
      image: ${{ steps.plan.outputs.image }}
      tag: ${{ steps.plan.outputs.tag }}
      exists: ${{ steps.plan.outputs.exists }}
      walg-changed: ${{ steps.plan.outputs.walg-changed }}
      walg-from: ${{ steps.plan.outputs.walg-from }}
      walg-tag: ${{ steps.plan.outputs.walg-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the input-commit lookup and the main merge-base need history
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        name: Resolve the dev tag and whether wal-g needs a build
        run: |
          set -euo pipefail
          IMG=$(grep -oP "^export const DEV_DB_IMAGE\s*=\s*'\K[^']+" src/lib/images.js)
          TAG=$(grep -oP "^export const DB_IMAGE_TAG\s*=\s*'\K[^']+" src/lib/images.js)
          LEN=$(grep -oP "^export const DEV_DB_IMAGE_SHA_LENGTH\s*=\s*\K[0-9]+" src/lib/images.js)
          # Same pathspec as tests/e2e/utils/db-image-select.js DB_IMAGE_INPUT_PATHSPEC.
          SHA=$(git log -1 --format=%H HEAD -- docker/postgres-walg docker/wal-g src/lib/images.js ':(exclude)docker/postgres-walg/README.md' ':(exclude)docker/wal-g/README.md')
          test -n "$SHA"
          DEV_TAG="$TAG-${SHA:0:$LEN}"
          case "$IMG" in */postgres-dev) ;; *) echo "refusing to publish to $IMG" >&2; exit 1 ;; esac
          # Only a definite "not found" means build; any other lookup error
          # fails the run rather than risk overwriting an existing dev tag.
          if out=$(docker buildx imagetools inspect "$IMG:$DEV_TAG" 2>&1 >/dev/null); then EXISTS=true
          elif grep -q 'not found' <<<"$out"; then EXISTS=false
          else echo "$out" >&2; exit 1; fi
          # wal-g: build it into this run only when this branch changed its
          # inputs; otherwise the db image COPY --froms the published tag.
          BASE=$(git merge-base origin/main HEAD)
          if git diff --quiet "$BASE" HEAD -- docker/wal-g ':(exclude)docker/wal-g/README.md'; then WALG=false; else WALG=true; fi
          FROM=$(grep -oP '^FROM \Kghcr\.io/hyperformant/wal-g:\S+' docker/postgres-walg/Dockerfile)
          {
            echo "image=$IMG"
            echo "tag=$DEV_TAG"
            echo "exists=$EXISTS"
            echo "walg-changed=$WALG"
            echo "walg-from=$FROM"
            echo "walg-tag=walg-${SHA:0:$LEN}"
          } >> "$GITHUB_OUTPUT"
          echo "dev tag $IMG:$DEV_TAG (exists=$EXISTS, wal-g changed=$WALG)" >> "$GITHUB_STEP_SUMMARY"
  # Only when this branch changed docker/wal-g. The SAME native per-arch build
  # as the release publish-walg job (native-multiarch-image.yml: wal-g smoked
  # on each arch's own runner before its digest is pushed), published into
  # the postgres-dev package itself under walg-<sha>, so the dev channel stays
  # one package. The db legs below consume it BY DIGEST (the reusable
  # workflow's `ref` output), never by that tag.
  build-walg:
    needs: plan
    # Same queue-then-skip rule as build-db for this run's walg-<sha> tag.
    concurrency:
      group: publish-db-image-dev-${{ needs.plan.outputs.walg-tag }}
      cancel-in-progress: false
    if: needs.plan.outputs.exists != 'true' && needs.plan.outputs.walg-changed == 'true'
    permissions:
      contents: read
      packages: write   # push the wal-g digests and its walg-<sha> tag into postgres-dev
    uses: ./.github/workflows/native-multiarch-image.yml
    with:
      name: walg-dev
      context: docker/wal-g
      image: ${{ needs.plan.outputs.image }}
      tag: ${{ needs.plan.outputs.walg-tag }}
      smoke: .github/scripts/smoke-walg-image.sh
      immutable: true
  build-db:
    needs: [plan, build-walg]
    # One run per dev tag at a time: a second run for the same tag queues
    # here, and the reusable workflow's `immutable` re-check then skips it.
    concurrency:
      group: publish-db-image-dev-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.exists != 'true' &&
      (needs.build-walg.result == 'success' || needs.build-walg.result == 'skipped')
    permissions:
      contents: read
      packages: write   # push the per-arch digests and the dev tag to postgres-dev
    uses: ./.github/workflows/native-multiarch-image.yml
    with:
      name: db-dev
      context: docker/postgres-walg
      image: ${{ needs.plan.outputs.image }}
      tag: ${{ needs.plan.outputs.tag }}
      smoke: .github/scripts/smoke-db-image.sh
      # The db Dockerfile's `FROM <walg-from>` (the full digest-pinned ref,
      # which is the build-context key) resolves to this run's wal-g digest
      # when the branch rebuilt wal-g, else to the pinned published build.
      build-contexts: >-
        ${{ needs.build-walg.result == 'success' &&
        format('{0}=docker-image://{1}', needs.plan.outputs.walg-from, needs.build-walg.outputs.ref) || '' }}
      immutable: true
