name: Release

# MANUAL GATE. A release is a human decision, not a consequence of pushing.
#
# This used to fire automatically on every successful Test Suite run on main,
# so any push that went green published to the public npm registry. That made
# the release cadence a side effect of commit cadence and gave no veto point.
#
# GitHub's native gate for this is an Environment with required reviewers, but
# protection rules need a paid plan on a private repo (the API rejects them
# with HTTP 422 here). A workflow_dispatch trigger achieves the same control
# with no plan dependency: you decide WHEN, and the guard job below still
# verifies the machine agrees the commit is green, so a manual dispatch cannot
# cut a release on red.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this release now (recorded in the run log)'
        required: false
        type: string

# Rapid consecutive pushes to main each chain their own release run;
# unserialized, the loser fails `git push HEAD:main` mid-prepare
# (observed 2026-07-10). Queue them instead — never cancel a release.
concurrency:
  group: release
  cancel-in-progress: false

# Least-privilege default (OpenSSF Scorecard Token-Permissions). The release
# job REPLACES this wholesale with its own block below — job-level permissions
# do not merge with this default.
permissions:
  contents: read

jobs:
  # Every mode pulls DB_IMAGE:DB_IMAGE_TAG (src/lib/images.js), local `up`
  # included, so a release whose db tag is missing, private, or lacks an arch
  # breaks create/up/deploy for every user at the first pull. This proves the
  # tag is pullable the way users pull it: anonymously (an empty
  # DOCKER_CONFIG, no login, so a private package fails here), with both
  # children present (amd64 for servers, arm64 for Apple Silicon `up`).
  # It is one read, not a wait: if publish-db-image has not finished, let it
  # finish and dispatch again.
  #
  # The node runtime base (NODE_RUNTIME_IMAGE) gets the same check: every
  # generated project's app image builds FROM it, locally and on servers, so
  # a release naming an unpublished or still-private tag breaks the first
  # `up` and deploy just as surely. A new ghcr package starts private; flip
  # it public after publish-node-runtime-image's first run.
  #
  # The runtime base must also be pinned BY DIGEST before any release: a tag
  # alone lets whoever can push to the package change what every generated
  # project runs on. The tag pin is the pre-publish state only (the digest
  # does not exist until the image is published); the post-publish commit
  # appends `@sha256:` to NODE_RUNTIME_IMAGE and carbon/Dockerfile's
  # `ARG RUNTIME_IMAGE=` (docker/node-runtime/README.md). This refuses until
  # both carry it, and until the pinned digest is what the tag resolves to.
  db-image:
    name: Verify the pinned db and node runtime images are public and multi-arch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Read the image refs the CLI pins
        run: node --input-type=module -e "const m = await import('./src/lib/images.js'); console.log('DB_IMAGE=' + m.DB_IMAGE); console.log('DB_IMAGE_TAG=' + m.DB_IMAGE_TAG); console.log('NODE_RUNTIME_IMAGE=' + m.NODE_RUNTIME_IMAGE);" >> "$GITHUB_ENV"

      - name: Inspect each anonymously and require linux/amd64 + linux/arm64
        run: |
          DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker-config"
          export DOCKER_CONFIG
          mkdir -p "$DOCKER_CONFIG"
          case "$NODE_RUNTIME_IMAGE" in
            *@sha256:*) ;;
            *)
              echo "::error::refusing to release: NODE_RUNTIME_IMAGE ($NODE_RUNTIME_IMAGE) is not pinned by digest. Once publish-node-runtime-image has published it and the package is public, append the @sha256: the tag resolves to (docker/node-runtime/README.md), then dispatch again."
              exit 1
              ;;
          esac
          runtime_arg=$(grep -oP '^ARG RUNTIME_IMAGE=\K\S+' carbon/Dockerfile || true)
          if [ "$runtime_arg" != "$NODE_RUNTIME_IMAGE" ]; then
            echo "::error::refusing to release: carbon/Dockerfile's ARG RUNTIME_IMAGE ($runtime_arg) is not NODE_RUNTIME_IMAGE ($NODE_RUNTIME_IMAGE)."
            exit 1
          fi
          for ref in "$DB_IMAGE:$DB_IMAGE_TAG" "$NODE_RUNTIME_IMAGE"; do
            if ! manifest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}'); then
              echo "::error::refusing to release: $ref is not pullable anonymously. Wait for its publish workflow (publish-db-image or publish-node-runtime-image) to finish on main, or make the ghcr package public, then dispatch again."
              exit 1
            fi
            platforms=$(printf '%s' "$manifest" | jq -r '.manifests[]?.platform | "\(.os)/\(.architecture)"' | sort -u)
            echo "Platforms in $ref:"
            echo "$platforms"
            for want in linux/amd64 linux/arm64; do
              if ! printf '%s\n' "$platforms" | grep -qx "$want"; then
                echo "::error::refusing to release: $ref has no $want child. Re-run its publish workflow for this tag, then dispatch again."
                exit 1
              fi
            done
          done
          runtime_tag=${NODE_RUNTIME_IMAGE%@*}
          runtime_pinned=${NODE_RUNTIME_IMAGE##*@}
          runtime_resolved=$(docker buildx imagetools inspect "$runtime_tag" --format '{{json .Manifest}}' | jq -r '.digest // empty' || true)
          if [ "$runtime_resolved" != "$runtime_pinned" ]; then
            echo "::error::refusing to release: $runtime_tag resolves to ${runtime_resolved:-nothing} anonymously, but NODE_RUNTIME_IMAGE pins $runtime_pinned. The tag moved or the pin is wrong; re-pin from the published tag, then dispatch again."
            exit 1
          fi

  # Every ghcr mirror (MIRRORED_IMAGES in src/lib/images.js: the
  # registry.k8s.io set, and since the cold-deploy-speed plan's Task 7 the
  # core-path Docker Hub images and k3s's system images) is pulled by servers
  # ANONYMOUSLY. A newly mirrored package starts PRIVATE and stays so until it
  # is flipped public by hand, and a mirror leg that never ran leaves no tag at
  # all; either way every deploy dies on ImagePullBackOff or a compose pull
  # error. This refuses a release until each digest-pinned mirror ref resolves
  # with an empty DOCKER_CONFIG (no login), the same way a server pulls it. One
  # read, not a wait: run publish-images, flip any new package public
  # (mirroredPackageNames()), then dispatch again.
  mirrored-images:
    name: Verify every ghcr mirror ref is pullable anonymously
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Inspect each mirror ref anonymously
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker-config"
          export DOCKER_CONFIG
          mkdir -p "$DOCKER_CONFIG"
          refs=$(node --input-type=module -e "const m = await import('./src/lib/images.js'); console.log(m.MIRRORED_IMAGES.map(m.k8sMirrorRef).join('\n'));")
          test -n "$refs"
          missing=0
          for ref in $refs; do
            if docker buildx imagetools inspect "$ref" > /dev/null; then
              echo "ok $ref"
            else
              echo "::error::$ref is not pullable anonymously"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::refusing to release: a ghcr mirror ref above is missing or private. Run publish-images (mirror-upstream-images) on main, flip every new package public by hand (mirroredPackageNames() in src/lib/images.js), then dispatch again."
            exit 1
          fi

  release:
    name: Semantic Release
    needs: [db-image, mirrored-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Needed by the guard below to read Test Suite runs. A top-level
      # permissions block sets every UNLISTED scope to none, so omitting this
      # makes the API call 403 — the exact failure that silently broke
      # dependabot-auto-merge for a month (missing `checks: read`).
      actions: read
      # npm TRUSTED PUBLISHING (OIDC). Lets this job mint a short-lived,
      # workflow-scoped token npm will accept, instead of a long-lived
      # NPM_TOKEN. Same "unlisted scope is none" rule as above — its absence
      # is why release 32530727366 failed:
      #
      #   Retrieval of GitHub Actions OIDC token failed: Unable to get
      #   ACTIONS_ID_TOKEN_REQUEST_URL env variable
      #   Have you granted the `id-token: write` permission to this workflow?
      #   ... npm error 401 Unauthorized - GET /-/whoami
      #   EINVALIDNPMTOKEN Invalid npm token.
      #
      # @semantic-release/npm 13.1.5 already tries OIDC first and only falls
      # back to NPM_TOKEN — that log line is the plugin's OIDC attempt, so
      # nothing needed upgrading, only this scope.
      #
      # WHY NOT JUST ROTATE THE TOKEN: the one that expired was a 2FA-bypass
      # automation token, and npm is actively restricting that class —
      # account changes Aug 2026, direct publishing Jan 2027 — with the token
      # form itself now saying "For automation or CI/CD uses, please use
      # Trusted Publishing instead." A fresh token would have expired again in
      # ~90 days, mid-beta.
      #
      # REQUIRES a matching publisher on npmjs.com (Package settings ->
      # Trusted Publisher): GitHub Actions, owner + repo, workflow filename
      # `release.yml`, environment left EMPTY — this job declares no
      # `environment:`, and the fields are case-sensitive and must match
      # exactly. One config per package, bound to owner/repo, so it must be
      # re-pointed when this repo moves to its public home.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Manual dispatch decides WHEN; this decides WHETHER. Without it, a
      # dispatch on a red commit would publish to npm regardless — the human
      # gate replaced an automated one, so the automated check has to survive.
      - name: Verify Test Suite is green for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # Via env, never interpolated into the script: workflow inputs are
          # attacker-controlled text in the general case and belong nowhere
          # near a shell command line.
          REASON: ${{ inputs.reason }}
        run: |
          echo "Release requested for $SHA"
          echo "Reason: ${REASON:-<none given>}"
          conclusion=$(gh api \
            "repos/$REPO/actions/workflows/test.yml/runs?head_sha=$SHA&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')
          echo "Test Suite conclusion for this commit: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::refusing to release $SHA — Test Suite is '$conclusion', not 'success'."
            echo "Push the commit and let Test Suite finish green before dispatching a release."
            exit 1
          fi

      # No `version:` — pnpm comes from the root package.json's
      # `packageManager` field, the same source the Test Suite gate used.
      # This step used to hardcode `9` while every test job ran 10.x, so the
      # published tarball was installed by a different pnpm than the one that
      # green-lit it.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # semantic-release runs git through a pnpm-installed checkout, so
          # husky hooks can fire; the pre-push gate spawns the integration
          # suite, whose licence stub signs its verdicts with this key. Same
          # class as the e2e-us-perf publish step (run 32309395314) —
          # inoculated here before it costs a release.
          VIBECARBON_LICENSE_PRIVATE_KEY: ${{ secrets.VIBECARBON_LICENSE_PRIVATE_KEY }}
