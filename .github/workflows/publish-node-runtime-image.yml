name: publish-node-runtime-image
# The node runtime base every app image builds FROM (docker/node-runtime,
# pinned as NODE_RUNTIME_IMAGE in src/lib/images.js and as carbon/Dockerfile's
# `ARG RUNTIME_IMAGE=` default). Same shape as publish-db-image.yml's db job:
# one NATIVE build per arch through native-multiarch-image.yml (ubuntu-24.04 /
# ubuntu-24.04-arm, never QEMU), the smoke script on each arch before anything
# is pushed, push by digest, then one merge job that names both digests under
# the tag and smoke-tests the published result.
#
# amd64 + arm64. Servers are amd64 only (src/lib/deploy/platform.js); the
# arm64 child lets local `vibecarbon up` on Apple Silicon build and run the
# app natively, since every local build is FROM this image too.
#
# The tag is immutable: NODE_RUNTIME_IMAGE's -r<N> revision moves with every
# input change (tests/unit/deploy/node-runtime-image-fingerprint.test.ts), so a
# tag names exactly one build and is published exactly once. runtime-ref skips
# the build when the tag already exists; `immutable` re-checks after the
# builds so a racing run never moves it either.
#
# FIRST PUBLISH: ghcr creates a new package PRIVATE. After the first run on
# main, flip ghcr.io/hyperformant/node-runtime to PUBLIC by hand (package
# settings, Change visibility); until then no server or developer machine can
# pull it, and release.yml refuses to release.
#
# Guarded by tests/unit/deploy/workflow-platforms.test.ts.
on:
  push:
    branches: [main]
    paths:
      - 'docker/node-runtime/**'
      - '!docker/node-runtime/README.md'
      - 'src/lib/images.js'
      - '.github/scripts/smoke-node-runtime-image.sh'
      - '.github/workflows/publish-node-runtime-image.yml'
  workflow_dispatch: {}
# Job-scoped writes only (OpenSSF Scorecard Token-Permissions: any
# top-level write zeroes the check). A job-level block replaces this
# wholesale, so jobs re-declare contents: read.
permissions:
  contents: read
jobs:
  runtime-ref:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read   # see whether the tag already exists
    outputs:
      image: ${{ steps.ref.outputs.image }}
      tag: ${{ steps.ref.outputs.tag }}
      exists: ${{ steps.ref.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        name: Resolve the ref from src/lib/images.js and whether it exists
        run: |
          set -euo pipefail
          REF=$(grep -oP "^export const NODE_RUNTIME_IMAGE\s*=\s*'\K[^']+" src/lib/images.js)
          # A published ref carries @sha256:<index digest>; the tag is what
          # this workflow publishes, so drop the digest first.
          REF=${REF%@*}
          IMG=${REF%:*}
          TAG=${REF##*:}
          test -n "$IMG" && test -n "$TAG" && test "$IMG:$TAG" = "$REF"
          # Only a definite "not found" means build; any other lookup error
          # fails the run rather than risk re-minting an existing tag.
          if out=$(docker buildx imagetools inspect "$IMG:$TAG" 2>&1 >/dev/null); then EXISTS=true
          elif grep -q 'not found' <<<"$out"; then EXISTS=false
          else echo "$out" >&2; exit 1; fi
          {
            echo "image=$IMG"
            echo "tag=$TAG"
            echo "exists=$EXISTS"
          } >> "$GITHUB_OUTPUT"
          echo "node-runtime $IMG:$TAG exists=$EXISTS" >> "$GITHUB_STEP_SUMMARY"
  build-runtime:
    needs: runtime-ref
    if: needs.runtime-ref.outputs.exists != 'true'
    permissions:
      contents: read
      packages: write   # push the per-arch digests and the multi-arch tag to ghcr
    uses: ./.github/workflows/native-multiarch-image.yml
    with:
      name: node-runtime
      context: docker/node-runtime
      image: ${{ needs.runtime-ref.outputs.image }}
      tag: ${{ needs.runtime-ref.outputs.tag }}
      smoke: .github/scripts/smoke-node-runtime-image.sh
      immutable: true
