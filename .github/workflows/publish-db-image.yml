name: publish-db-image
on:
  push:
    branches: [main]
    paths:
      - 'docker/wal-g/**'
      - 'docker/postgres-walg/**'
      - 'src/lib/images.js'
      - '.github/workflows/publish-db-image.yml'
  workflow_dispatch: {}
# Job-scoped writes only (OpenSSF Scorecard Token-Permissions: any
# top-level write zeroes the check). A job-level block replaces this
# wholesale, so jobs re-declare contents: read.
permissions:
  contents: read
jobs:
  # The static wal-g binary image. The db image below COPY --froms it BY
  # DIGEST (docker/postgres-walg/Dockerfile pins
  # ghcr.io/hyperformant/wal-g:<version>@sha256:...), so that Dockerfile line
  # is the single record of which wal-g build the db image carries, and the
  # db build never consumes a digest this run just minted. wal-g republishes
  # only when its own inputs changed in this push (or its tag is missing, or
  # on a manual dispatch): every other run would otherwise move the tag's
  # digest for nothing (the build is not byte-reproducible) and leave the
  # pin looking stale. Adopting a republished wal-g is a re-pin of that FROM
  # line plus a DB_IMAGE_TAG revision bump; Dependabot's docker ecosystem
  # watches docker/postgres-walg and proposes the re-pin.
  #
  # amd64 + arm64, each built on its OWN native runner through the same
  # native-multiarch-image.yml the db image uses (ubuntu-24.04 /
  # ubuntu-24.04-arm), never QEMU. docker/wal-g/Dockerfile's smoke stage
  # (`RUN wal-g --version` on TARGETPLATFORM) therefore executes natively on
  # both arches instead of leaning on whatever binfmt the runner image ships,
  # and .github/scripts/smoke-walg-image.sh runs each arch before its digest
  # is pushed, then again on the merged tag. Its one consumer is the db
  # image's two native per-arch builds below. Guarded by
  # tests/unit/deploy/workflow-platforms.test.ts.
  #
  # The ghcr package must be PUBLIC (same rule as ghcr.io/hyperformant/postgres).
  walg-ref:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read   # see whether the wal-g tag already exists
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # diff this push's range for docker/wal-g changes
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        name: Resolve the wal-g version and whether to publish it
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          V=$(grep -oP 'ARG WALG_VERSION=v\K[0-9.]+' docker/wal-g/Dockerfile)
          test -n "$V"
          # Only a definite "not found" counts as missing; any other lookup
          # error fails the run rather than guess.
          if out=$(docker buildx imagetools inspect "ghcr.io/hyperformant/wal-g:$V" 2>&1 >/dev/null); then MISSING=false
          elif grep -q 'not found' <<<"$out"; then MISSING=true
          else echo "$out" >&2; exit 1; fi
          if [ "$EVENT" != push ] || [ "$MISSING" = true ]; then PUBLISH=true
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then PUBLISH=true
          elif git diff --quiet "$BEFORE" HEAD -- docker/wal-g ':(exclude)docker/wal-g/README.md'; then PUBLISH=false
          else PUBLISH=true; fi
          {
            echo "tag=$V"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "wal-g $V: missing=$MISSING publish=$PUBLISH" >> "$GITHUB_STEP_SUMMARY"
  publish-walg:
    needs: walg-ref
    if: needs.walg-ref.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write   # push the per-arch digests and the multi-arch tag to ghcr
    uses: ./.github/workflows/native-multiarch-image.yml
    with:
      name: walg
      context: docker/wal-g
      image: ghcr.io/hyperformant/wal-g
      tag: ${{ needs.walg-ref.outputs.tag }}
      smoke: .github/scripts/smoke-walg-image.sh
      environment: e2e-infra
  # The db image: one NATIVE build per arch, then one multi-arch tag.
  #
  # amd64 + arm64. Servers are amd64 only (src/lib/deploy/platform.js); the
  # arm64 child exists solely so local `vibecarbon up` on Apple Silicon runs
  # Postgres natively, since every mode (local dev included) pulls this image.
  #
  # The build itself is native-multiarch-image.yml, shared with the branch dev
  # channel (publish-db-image-dev.yml): per-arch native runners, the smoke
  # script (.github/scripts/smoke-db-image.sh) on each arch before anything is
  # pushed, push by digest, then one merge job that names both digests under
  # the tag and smoke-tests the published result.
  #
  # Guarded by tests/unit/deploy/workflow-platforms.test.ts.
  # The release tag is immutable: DB_IMAGE_TAG's -r<N> revision moves with
  # every input change (tests/unit/deploy/db-image-fingerprint.test.ts), so a
  # tag names exactly one build and is published exactly once. db-ref skips
  # the build when the tag already exists, which is what keeps a push that
  # touches only docker/wal-g (or only this workflow) from re-minting the
  # release image under a tag servers already hold; `immutable` re-checks after
  # the builds so a racing run never moves it either.
  db-ref:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read   # see whether the release tag already exists
    outputs:
      image: ${{ steps.ref.outputs.image }}
      tag: ${{ steps.ref.outputs.tag }}
      exists: ${{ steps.ref.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        name: Resolve the release ref from src/lib/images.js and whether it exists
        run: |
          set -euo pipefail
          IMG=$(grep -oP "^export const DB_IMAGE\s*=\s*'\K[^']+" src/lib/images.js)
          TAG=$(grep -oP "^export const DB_IMAGE_TAG\s*=\s*'\K[^']+" src/lib/images.js)
          test -n "$IMG" && test -n "$TAG"
          # Only a definite "not found" means build; any other lookup error
          # fails the run rather than risk re-minting an existing tag.
          if out=$(docker buildx imagetools inspect "$IMG:$TAG" 2>&1 >/dev/null); then EXISTS=true
          elif grep -q 'not found' <<<"$out"; then EXISTS=false
          else echo "$out" >&2; exit 1; fi
          {
            echo "image=$IMG"
            echo "tag=$TAG"
            echo "exists=$EXISTS"
          } >> "$GITHUB_OUTPUT"
          echo "db $IMG:$TAG exists=$EXISTS" >> "$GITHUB_STEP_SUMMARY"
  # No `needs: publish-walg`: the db image takes wal-g from the digest its
  # Dockerfile pins, which is already published, never from this run.
  build-db:
    needs: db-ref
    if: needs.db-ref.outputs.exists != 'true'
    permissions:
      contents: read
      packages: write   # push the per-arch digests and the multi-arch tag to ghcr
    uses: ./.github/workflows/native-multiarch-image.yml
    with:
      name: db
      context: docker/postgres-walg
      image: ${{ needs.db-ref.outputs.image }}
      tag: ${{ needs.db-ref.outputs.tag }}
      smoke: .github/scripts/smoke-db-image.sh
      environment: e2e-infra
      immutable: true
