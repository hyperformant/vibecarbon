name: publish-db-image
on:
  push:
    branches: [main]
    paths:
      - 'docker/postgres-walg/**'
      - 'src/lib/images.js'
      - '.github/workflows/publish-db-image.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write   # push to ghcr
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: e2e-infra
    steps:
      - uses: actions/checkout@v7
      - id: ref
        name: Resolve ref from src/lib/images.js
        run: |
          IMG=$(grep -oP "DB_IMAGE\s*=\s*'\K[^']+" src/lib/images.js)
          TAG=$(grep -oP "DB_IMAGE_TAG\s*=\s*'\K[^']+" src/lib/images.js)
          echo "image=$IMG:$TAG" >> "$GITHUB_OUTPUT"
      # amd64-only, deliberately — and note this is NOT the same question as
      # "does anything arm64 build this Dockerfile?".
      #
      # WHO PULLS THIS IMAGE: k8s deploys, and only k8s deploys. The ref is
      # substituted into carbon/k8s/values/supabase.values.yaml's {{DB_IMAGE}}/
      # {{DB_IMAGE_TAG}} placeholders by installSupabase (src/lib/deploy/k8s/
      # k3s.js) and materialized by containerd on the k3s nodes. It is never
      # sideloaded, and `helm` running locally does not pull it — the remote
      # cluster does.
      #
      # WHO DOES NOT: local development. The generated project's compose stack
      # BUILDS the db from carbon/db/Dockerfile (`build: {context: ./db}` +
      # `pull_policy: build` in carbon/docker-compose.yml) — including for
      # compose *deploys*, where reconcile.sh runs `docker compose up` on the
      # server itself. So no developer machine, Apple Silicon or otherwise,
      # ever pulls this image, and dropping arm64 here cannot break local dev.
      #
      # That is why carbon/db/Dockerfile and docker/postgres-walg/Dockerfile
      # KEEP their arm64 TARGETARCH branches: those are build-time paths that
      # still run on arm64 hosts, and the `wal-g --version` exec in them is the
      # only place a wrong-arch or glibc-mismatched binary fails loudly. Single
      # published platform + arch-correct Dockerfiles is intentional.
      #
      # vibecarbon standardizes on x86-64 servers (decision 2026-07-30):
      # DigitalOcean has no ARM instances at all, and Hetzner ARM is 4 SKUs in
      # 3 of 6 locations behind a "limited availability" tier.
      #
      # No foreign architecture is built, so docker/setup-qemu-action is gone.
      # Measured on run 30456193724 (the last multi-arch publish): setup-qemu
      # 9s + a 2m20s two-arch build-push out of a 4m07s job — the emulated
      # arm64 leg (apt-get + wal-g download + `wal-g --version` under QEMU) is
      # roughly half of that build, so expect ~1m15s back per run.
      #
      # Bonus: the smoke-test step below only ever exercised the amd64 image
      # even while arm64 was published. Now that amd64 is all we publish, the
      # smoke test covers 100% of the artifact instead of half of it.
      #
      # Guarded by tests/unit/deploy/workflow-platforms.test.ts.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: docker/postgres-walg
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ref.outputs.image }}
      - name: Smoke-test wal-g on the published amd64 image
        run: docker run --rm --entrypoint wal-g ${{ steps.ref.outputs.image }} --version
