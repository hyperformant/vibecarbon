# Every image a cluster pulls that is not published by publish-db-image.yml:
# the one image this org BUILDS (carbon-autoscaler) plus the whole
# mirror-upstream-images matrix (#237). Named for the set, not for its first
# member — it was `publish-carbon-autoscaler-image` until the mirror matrix
# grew past it.
name: publish-images
on:
  push:
    branches: [main]
    paths:
      - 'docker/carbon-autoscaler/**'
      - 'src/autoscaler/**'
      - 'src/lib/providers/**'
      - 'src/lib/images.js'
      - '.github/scripts/image-const.mjs'
      - 'scripts/mirror-matrix.mjs'
      - '.github/workflows/publish-images.yml'
      - '.github/workflows/mirror-images.yml'
  workflow_dispatch: {}
  # Weekly drift report only (mirror-upstream-drift). Every publishing job
  # skips scheduled runs: a schedule must never push to ghcr.
  schedule:
    - cron: '0 14 * * 1'
# Job-scoped writes only (OpenSSF Scorecard Token-Permissions: any
# top-level write zeroes the check). A job-level block replaces this
# wholesale, so jobs re-declare contents: read. mirror-matrix stays on
# the read-only default — it only computes the matrix.
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment: e2e-infra
    permissions:
      contents: read
      packages: write   # push to ghcr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: ref
        name: Resolve ref from src/lib/images.js
        run: |
          set -euo pipefail
          IMG=$(node .github/scripts/image-const.mjs CARBON_AUTOSCALER_IMAGE)
          TAG=$(node .github/scripts/image-const.mjs CARBON_AUTOSCALER_TAG)
          echo "image=$IMG:$TAG" >> "$GITHUB_OUTPUT"
      # amd64-only, deliberately. This image has exactly ONE consumer: the
      # `carbon-autoscaler` sidecar in carbon/k8s/base/cluster-autoscaler/
      # deployment.yaml, which is nodeSelector-pinned to
      # node-role.kubernetes.io/control-plane — i.e. it only ever runs on a
      # provisioned k3s control-plane server, never on a developer machine.
      # vibecarbon standardizes on x86-64 servers (2026-07-30): DigitalOcean
      # offers no ARM instances at all, and Hetzner ARM is 4 SKUs in 3 of 6
      # locations behind a "limited availability" tier. No arm64 consumer
      # exists, so building one is pure QEMU tax.
      #
      # Native amd64 on the ubuntu-latest runner needs no
      # docker/setup-qemu-action, so that step is gone too. Measured on run
      # 30588306810 (the last multi-arch publish): setup-qemu 7s + a 36s
      # two-arch build-push out of a 60s job. Dropping the emulated arm64 leg
      # is worth ~25s per run here — small, but it is pure waste.
      #
      # Guarded by tests/unit/deploy/workflow-platforms.test.ts.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/carbon-autoscaler/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ref.outputs.image }}
      - name: Smoke-test the full server import graph on the published amd64 image
        # Imports server.js (superset of proto.js) — catches any runtime dep
        # missing from the image's npm-install line. Field-proven 2026-07-27:
        # the proto-only smoke missed undici + @clack/prompts, and the sidecar
        # crash-looped on the first real k8s deploy.
        run: |
          docker run --rm --entrypoint node ${{ steps.ref.outputs.image }} \
            -e "import('/app/src/autoscaler/server.js').then(()=>console.log('server import ok')).catch(e=>{console.error(e.message);process.exit(1)})"

  # Resolve the mirror set ONCE, into a matrix. The list lives in
  # src/lib/images.js and is read by importing it, not by grepping it: #222
  # resolved two scalar constants and `grep -oP` was fine, but the set is now a
  # list of (repo, tag) tuples, which grep cannot express. A pattern that
  # silently matches nothing writes an empty ref like ":" into $GITHUB_OUTPUT —
  # a silent CI failure, not a visible one. scripts/mirror-matrix.mjs has no
  # dependencies (plain ESM over a constants module), so this job needs no
  # install step. Guarded by tests/unit/deploy/k8s-image-mirrors.test.ts, which
  # runs THAT EXACT SCRIPT and compares its output to the constants.
  mirror-matrix:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: gen
        name: Build the mirror matrix from src/lib/images.js
        run: |
          set -euo pipefail
          INCLUDE=$(node scripts/mirror-matrix.mjs)
          test -n "$INCLUDE"
          echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"

  # The job lives in its own file so the version channel runs the same one on
  # the versions it picked (.github/workflows/version-channel.yml). A reusable
  # workflow sees the caller's `github` context, so adding workflow_call to this
  # file would bring its schedule gating along.
  mirror-upstream-images:
    needs: mirror-matrix
    uses: ./.github/workflows/mirror-images.yml
    permissions:
      contents: read
      packages: write   # push mirrored manifests to ghcr
    with:
      include: ${{ needs.mirror-matrix.outputs.include }}
    # e2e-infra's Docker Hub credential. The called job names the environment,
    # and a caller cannot; this is what hands it down.
    secrets: inherit

  # Weekly: newer upstream tags for every mirrored repo. REPORT ONLY, never a
  # re-pin: Dependabot cannot see refs that point at our mirror, so this is
  # how an upstream release gets noticed, and a bump stays a reviewed edit of
  # {tag, digest, index} in src/lib/images.js. Per-entry ceilings in
  # scripts/mirror-drift.mjs hold back tags we must not take (alpine/k8s past
  # one minor of K3S_VERSION, registry 3.x, k3s system images and CSI
  # sidecars, which move only with K3S_VERSION / the CSI driver). With
  # anything to take it opens, or updates, ONE issue with a fixed title.
  # Schedule only: a lookup failure fails this job loudly, and must never
  # turn a dispatched publish red. No environment, no login (tags/list takes
  # an anonymous token); the only write is `issues`.
  mirror-upstream-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # open or update the one drift issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: List newer upstream tags per mirrored repo
        run: |
          set -euo pipefail
          # A failed lookup still writes its row: publish the report, then
          # fail with the script's status.
          rc=0
          node scripts/mirror-drift.mjs > "$RUNNER_TEMP/drift.md" || rc=$?
          cat "$RUNNER_TEMP/drift.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Mirror drift: newer upstream tags for ghcr mirrors'
        run: |
          set -euo pipefail
          if grep -q '^<!-- mirror-drift: none -->$' "$RUNNER_TEMP/drift.md"; then
            echo "no actionable drift"
            exit 0
          fi
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE))[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file "$RUNNER_TEMP/drift.md"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/drift.md"
          fi
