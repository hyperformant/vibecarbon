version: 2

updates:
  # Root CLI package
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
      include: scope
    labels:
      - dependencies
    groups:
      # vitest and @vitest/* must move together: @vitest/coverage-v8 declares
      # an EXACT `vitest` peer, so a split bump fails the strict `npm ci`
      # (#61 + #65 each red on their own, superseded by #69). Listed first,
      # with explicit patterns and no update-types filter, so it claims the
      # pair at every semver level before the broader groups below.
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]
      production-patches:
        applies-to: version-updates
        dependency-type: production
        update-types: [patch]
      development-patches-and-minors:
        applies-to: version-updates
        dependency-type: development
        update-types: [patch, minor]
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]

  # Template (carbon/) — ships to user projects.
  #
  # carbon/package-lock.json is PROJECT PAYLOAD, not a CI convenience: `create`
  # copies it into every new npm project instead of resolving the tree there
  # (see writeTemplateLockfile in src/lib/package-manager.js). Three
  # consequences for anyone editing this block:
  #
  #   1. These PRs are what keeps new projects current. Never set a
  #      versioning-strategy that stops Dependabot rewriting the lockfile —
  #      the lock IS the shipped artifact, package.json ranges are not.
  #   2. Weekly is deliberate and sufficient. Security advisories do NOT wait
  #      for this schedule; Dependabot opens those as soon as they land, and
  #      dependabot-auto-merge.yml merges them once CI is green.
  #   3. Transitive-only drift no longer reaches users on its own. It used to
  #      arrive free, because every `create` re-resolved the floating ranges on
  #      the user's machine. Now it lands only via these PRs and the security
  #      ones — which is the point (a tested tree beats a fresh unknown one),
  #      but it means letting this block rot has user-visible reach.
  #
  # The Template Tests job in test.yml runs `npm ci` + typecheck + test:prepush
  # + build against this lockfile, so a bump that breaks it cannot merge.
  - package-ecosystem: npm
    directory: /carbon
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(template-deps)
      include: scope
    labels:
      - dependencies
      - template
    groups:
      # Same lockstep rule as the root block: vitest + @vitest/* in one PR.
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]
      template-patches:
        applies-to: version-updates
        update-types: [patch]
      template-dev-minors:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor]
      template-security:
        applies-to: security-updates
        patterns: ["*"]

  # GitHub Actions versions (referenced in .github/workflows/*.yml)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci-deps)
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      all-actions:
        patterns: ["*"]

  # Docker image digests. Every image ref this repo ships is pinned as
  # `name:tag@sha256:<index digest>` (tests/unit/deploy/image-digest-census.test.ts
  # fails on one that is not); these entries keep the digests moving when
  # upstream retags and propose new tags. Directories:
  #   - Dockerfiles: the template app, our three published images (wal-g's
  #     golang/alpine build stages included), and .github/image-pins, the
  #     never-built Dockerfile that mirrors the pins held in JS constants
  #     (socat, registry, diagnose probes, DO CSI init); its header says which
  #     constant to update in the same PR.
  #   - Kubernetes manifests (the docker ecosystem reads `image:` in
  #     Deployment/StatefulSet/CronJob YAML): carbon/k8s/base/* and the
  #     add-on services' k8s directories.
  # Not reachable by any ecosystem, so not listed: the registry.k8s.io mirror
  # digests in src/lib/images.js (re-derived with the CSI / cluster-autoscaler
  # version, and verified by publish-images.yml on every run), and the
  # project's own app image and our own db / carbon-autoscaler images
  # (published by this repo's workflows; see the census allowlist).
  - package-ecosystem: docker
    directories:
      - /carbon
      - /docker/carbon-autoscaler
      - /docker/postgres-walg
      - /docker/wal-g
      - /.github/image-pins
      - /carbon/k8s/base/*
      - /services/*/k8s
    ignore:
      # A PostgreSQL major is a data-format change (dump/restore or
      # pg_upgrade), never a routine bump. Minors and digest moves still come
      # through; each one also moves DB_IMAGE_TAG (src/lib/images.js), which
      # the PR must do by hand (tests/unit/deploy/walg-dockerfile-arch.test.ts
      # fails until then). The same holds for a wal-g re-pin in
      # docker/postgres-walg (bump the DB_IMAGE_TAG -r revision).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # registry 3 changed its config format; the compose registry and the
      # k8s local registry both run a 2.x config.
      - dependency-name: registry
        update-types: ["version-update:semver-major"]
      # alpine/k8s tags track Kubernetes minors and the backup CronJob's
      # kubectl must stay within one minor of k3s (K3S_VERSION in
      # src/lib/deploy/k8s/k3s.js). Patches and digest moves still come.
      - dependency-name: alpine/k8s
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Our ghcr mirror: the manifest pins upstream's amd64 child digest
      # (CLUSTER_AUTOSCALER_DIGEST in src/lib/images.js), not the mirror
      # tag's index digest, so a Dependabot "update" would only break the
      # parity guard. images.js owns this ref.
      - dependency-name: ghcr.io/hyperformant/cluster-autoscaler
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(docker-deps)
      include: scope
    labels:
      - dependencies
    groups:
      all-docker:
        patterns: ["*"]

  # Compose files: the template's (shipped into every project), the add-on
  # services', and the ACME isolation harness. Same pin form and the same
  # census as above. A Traefik tag bump must also move the CRD URL in
  # carbon/k8s/base/traefik (tests/unit/template/traefik-crd-version.test.ts).
  - package-ecosystem: docker-compose
    directories:
      - /carbon
      - /services/*/compose
      - /scripts/acme-iso
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(docker-deps)
      include: scope
    labels:
      - dependencies
    groups:
      all-compose:
        patterns: ["*"]
