version: 2

updates:
  # Root CLI package
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
      include: scope
    labels:
      - dependencies
    groups:
      # vitest and @vitest/* must move together: @vitest/coverage-v8 declares
      # an EXACT `vitest` peer, so a split bump fails the strict `npm ci`
      # (#61 + #65 each red on their own, superseded by #69). Listed first,
      # with explicit patterns and no update-types filter, so it claims the
      # pair at every semver level before the broader groups below.
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]
      production-patches:
        applies-to: version-updates
        dependency-type: production
        update-types: [patch]
      development-patches-and-minors:
        applies-to: version-updates
        dependency-type: development
        update-types: [patch, minor]
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]

  # Template (carbon/) — ships to user projects.
  #
  # carbon/package-lock.json is PROJECT PAYLOAD, not a CI convenience: `create`
  # copies it into every new npm project instead of resolving the tree there
  # (see writeTemplateLockfile in src/lib/package-manager.js). Three
  # consequences for anyone editing this block:
  #
  #   1. These PRs are what keeps new projects current. Never set a
  #      versioning-strategy that stops Dependabot rewriting the lockfile —
  #      the lock IS the shipped artifact, package.json ranges are not.
  #   2. Weekly is deliberate and sufficient. Security advisories do NOT wait
  #      for this schedule; Dependabot opens those as soon as they land, and
  #      dependabot-auto-merge.yml merges them once CI is green.
  #   3. Transitive-only drift no longer reaches users on its own. It used to
  #      arrive free, because every `create` re-resolved the floating ranges on
  #      the user's machine. Now it lands only via these PRs and the security
  #      ones — which is the point (a tested tree beats a fresh unknown one),
  #      but it means letting this block rot has user-visible reach.
  #
  # The Template Tests job in test.yml runs `npm ci` + typecheck + test:prepush
  # + build against this lockfile, so a bump that breaks it cannot merge.
  - package-ecosystem: npm
    directory: /carbon
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(template-deps)
      include: scope
    labels:
      - dependencies
      - template
    groups:
      # Same lockstep rule as the root block: vitest + @vitest/* in one PR.
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]
      template-patches:
        applies-to: version-updates
        update-types: [patch]
      template-dev-minors:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor]
      template-security:
        applies-to: security-updates
        patterns: ["*"]

  # GitHub Actions versions (referenced in .github/workflows/*.yml)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci-deps)
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      all-actions:
        patterns: ["*"]

  # Docker image digests. Every image ref this repo ships is pinned as
  # `name:tag@sha256:<index digest>` (tests/unit/deploy/image-digest-census.test.ts
  # fails on one that is not); these entries keep the digests moving when
  # upstream retags and propose new tags. Three kinds of PR, so a bump that
  # needs a hand edit (and is red until it gets one) never blocks the rest:
  #
  #   1. `images` (multi-ecosystem group, below): every bump that applies
  #      cleanly. Dockerfiles, Kubernetes manifests (the docker ecosystem reads
  #      `image:` in YAML that has apiVersion + kind) and compose files land in
  #      ONE PR, so an image used in both compose and k8s (traefik, grafana,
  #      loki, prometheus, n8n, metabase, redis) moves in both at once; the
  #      census also fails when their tags differ.
  #   2. `js-pins`: .github/image-pins/Dockerfile, the never-built mirror of
  #      the pins held in JS constants (socat, registry, diagnose probes, DO CSI
  #      init, binfmt). Red until the constant named in that file's header is
  #      updated in the same PR. alpine/socat and registry are bumped ONLY
  #      here (every other entry ignores them): their k8s copies must equal the
  #      JS constant, so they move together by hand.
  #   3. `db-image`: docker/postgres-walg (postgres base, wal-g stage). Red
  #      until DB_IMAGE_TAG's -r revision and DB_IMAGE_INPUTS_SHA256 move
  #      (tests/unit/deploy/db-image-fingerprint.test.ts).
  #
  # Not reachable by any ecosystem: the registry.k8s.io mirror digests in
  # src/lib/images.js (re-derived with the CSI / cluster-autoscaler version,
  # and verified by publish-images.yml on every run), and the project's own
  # app image and our own db / carbon-autoscaler images (published by this
  # repo's workflows; see the census allowlist). Compose overlays named
  # docker-compose.<a>.<b>.yml (e.g. docker-compose.n8n.prod.yml) do not match
  # Dependabot's compose filename pattern; they carry no images, and the
  # census fails if one ever gains an `image:` line.
  - package-ecosystem: docker
    directories:
      - /carbon
      - /docker/carbon-autoscaler
      - /docker/wal-g
      - /carbon/k8s/base/*
      - /services/*/k8s
    multi-ecosystem-group: images
    patterns: ["*"]
    ignore:
      # Bumped only by the js-pins entry (see 2. above).
      - dependency-name: alpine/socat
      - dependency-name: registry
      # alpine/k8s tags track Kubernetes minors and the backup CronJob's
      # kubectl must stay within one minor of k3s (K3S_VERSION in
      # src/lib/deploy/k8s/k3s.js). Patches and digest moves still come.
      - dependency-name: alpine/k8s
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Our ghcr mirror: the manifest pins upstream's amd64 child digest
      # (CLUSTER_AUTOSCALER_DIGEST in src/lib/images.js), not the mirror
      # tag's index digest, so a Dependabot "update" would only break the
      # parity guard. images.js owns this ref.
      - dependency-name: ghcr.io/hyperformant/cluster-autoscaler
    # commit-message is group-only for multi-ecosystem entries (set below).
    labels:
      - dependencies

  # Compose files: the template's (shipped into every project), the add-on
  # services', and the ACME isolation harness. Same `images` PR as the
  # Dockerfiles and k8s manifests. A Traefik tag bump must also move the CRD
  # URL in carbon/k8s/base/traefik (tests/unit/template/traefik-crd-version.test.ts).
  - package-ecosystem: docker-compose
    directories:
      - /carbon
      - /services/*/compose
      - /scripts/acme-iso
    multi-ecosystem-group: images
    patterns: ["*"]
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /.github/image-pins
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(docker-deps)
      include: scope
    labels:
      - dependencies
    groups:
      js-pins:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker/postgres-walg
    # A PostgreSQL major is a data-format change (dump/restore or
    # pg_upgrade), never a routine bump. Minors, digest moves and wal-g
    # re-pins still come through.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(docker-deps)
      include: scope
    labels:
      - dependencies
    groups:
      db-image:
        patterns: ["*"]

multi-ecosystem-groups:
  images:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    commit-message:
      prefix: chore(docker-deps)
      include: scope
