version: 2

updates:
  # Root CLI package
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
      include: scope
    labels:
      - dependencies
    groups:
      # vitest and @vitest/* must move together: @vitest/coverage-v8 declares
      # an EXACT `vitest` peer, so a split bump fails the strict `npm ci`
      # (#61 + #65 each red on their own, superseded by #69). Listed first,
      # with explicit patterns and no update-types filter, so it claims the
      # pair at every semver level before the broader groups below.
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]
      production-patches:
        applies-to: version-updates
        dependency-type: production
        update-types: [patch]
      development-patches-and-minors:
        applies-to: version-updates
        dependency-type: development
        update-types: [patch, minor]
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]

  # Template (carbon/) — ships to user projects.
  #
  # carbon/package-lock.json is PROJECT PAYLOAD, not a CI convenience: `create`
  # copies it into every new npm project instead of resolving the tree there
  # (see writeTemplateLockfile in src/lib/package-manager.js). Three
  # consequences for anyone editing this block:
  #
  #   1. These PRs are what keeps new projects current. Never set a
  #      versioning-strategy that stops Dependabot rewriting the lockfile —
  #      the lock IS the shipped artifact, package.json ranges are not.
  #   2. Weekly is deliberate and sufficient. Security advisories do NOT wait
  #      for this schedule; Dependabot opens those as soon as they land, and
  #      dependabot-auto-merge.yml merges them once CI is green.
  #   3. Transitive-only drift no longer reaches users on its own. It used to
  #      arrive free, because every `create` re-resolved the floating ranges on
  #      the user's machine. Now it lands only via these PRs and the security
  #      ones — which is the point (a tested tree beats a fresh unknown one),
  #      but it means letting this block rot has user-visible reach.
  #
  # The Template Tests job in test.yml runs `npm ci` + typecheck + test:prepush
  # + build against this lockfile, so a bump that breaks it cannot merge.
  - package-ecosystem: npm
    directory: /carbon
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(template-deps)
      include: scope
    labels:
      - dependencies
      - template
    groups:
      # Same lockstep rule as the root block: vitest + @vitest/* in one PR.
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]
      template-patches:
        applies-to: version-updates
        update-types: [patch]
      template-dev-minors:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor]
      template-security:
        applies-to: security-updates
        patterns: ["*"]

  # GitHub Actions versions (referenced in .github/workflows/*.yml)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci-deps)
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      all-actions:
        patterns: ["*"]

  # Docker image digests. Every image ref this repo ships is pinned as
  # `name:tag@sha256:<index digest>` (tests/unit/deploy/image-digest-census.test.ts
  # fails on one that is not); these entries keep the digests moving when
  # upstream retags and propose new tags. Three kinds of PR, so a bump that
  # needs a hand edit (and is red until it gets one) never blocks the rest:
  #
  #   1. `images` (multi-ecosystem group, below): every bump that applies
  #      cleanly. Dockerfiles, Kubernetes manifests (the docker ecosystem reads
  #      `image:` in YAML that has apiVersion + kind) and compose files land in
  #      ONE PR, so an image used in both compose and k8s (traefik, grafana,
  #      loki, prometheus, n8n, metabase, redis) moves in both at once; the
  #      census also fails when their tags differ.
  #   2. `js-pins`: .github/image-pins/Dockerfile, the never-built mirror of
  #      the Docker Hub pins still held in JS constants (diagnose probes,
  #      binfmt). Red until the constant named in that file's header is
  #      updated in the same PR.
  #   3. `db-image`: docker/postgres-walg (postgres base, wal-g stage). Red
  #      until DB_IMAGE_TAG's -r revision and DB_IMAGE_INPUTS_SHA256 move
  #      (tests/unit/deploy/db-image-fingerprint.test.ts).
  #   4. `node-runtime`: docker/node-runtime (node image, alpine base). Red
  #      until NODE_RUNTIME_IMAGE's -r revision, its copy in carbon/Dockerfile
  #      (`ARG RUNTIME_IMAGE=`) and NODE_RUNTIME_INPUTS_SHA256 move
  #      (tests/unit/deploy/node-runtime-image-fingerprint.test.ts).
  #
  # OUR GHCR MIRRORS ARE NOT DEPENDABOT'S (cold-deploy-speed plan, Task 7).
  # Every image a deploy pulls that upstream hosts on registry.k8s.io or Docker
  # Hub is mirrored into ghcr.io/hyperformant/<name> by publish-images.yml:
  # cluster-autoscaler, the CSI sidecars, pause, and since Task 7 traefik (on
  # servers), docker-socket-proxy, alpine, registry, socat, alpine/k8s and
  # k3s's own system images. Their refs pin upstream's linux/amd64 CHILD
  # digest, which no ecosystem can propose (the mirror tag's own digest is the
  # index the job mints), so the entries below ignore every mirror name and a
  # bump follows the registry.k8s.io mirrors' flow: edit {tag, digest} in
  # src/lib/images.js and the literal compose / k8s copies (the mirror census
  # fails until every copy names an entry exactly), merge, and publish-images
  # mirrors the new tag. Its weekly `mirror-upstream-drift` job lists newer
  # upstream tags, so a release upstream is not missed. The base compose
  # traefik (local `up`, Docker Hub's multi-arch index) stays Dependabot's;
  # its bump goes red until TRAEFIK_MIRROR moves to the same tag.
  #
  # Not reachable by any ecosystem: the mirror digests above (verified by
  # publish-images.yml on every run), and the project's own
  # app image and our own db / carbon-autoscaler / node-runtime images
  # (published by this repo's workflows; see the census allowlist). Compose overlays named
  # docker-compose.<a>.<b>.yml (e.g. docker-compose.n8n.prod.yml) do not match
  # Dependabot's compose filename pattern; they carry no images, and the
  # census fails if one ever gains an `image:` line.
  - package-ecosystem: docker
    directories:
      - /carbon
      - /docker/carbon-autoscaler
      - /docker/wal-g
      - /carbon/k8s/base/*
      - /services/*/k8s
    multi-ecosystem-group: images
    patterns: ["*"]
    ignore:
      # Our ghcr mirrors (see OUR GHCR MIRRORS above): each manifest pins
      # upstream's amd64 child digest, not the mirror tag's index digest, so
      # a Dependabot "update" would only break the mirror census. images.js
      # owns these refs.
      - dependency-name: ghcr.io/hyperformant/cluster-autoscaler
      - dependency-name: ghcr.io/hyperformant/traefik
      - dependency-name: ghcr.io/hyperformant/registry
      - dependency-name: ghcr.io/hyperformant/socat
      - dependency-name: ghcr.io/hyperformant/k8s
      # Our node runtime base, carbon/Dockerfile's `ARG RUNTIME_IMAGE=`. It
      # must equal NODE_RUNTIME_IMAGE byte for byte (census), so a Dependabot
      # tag or digest move here would only break parity. images.js owns this
      # ref; docker/node-runtime has its own entry below.
      - dependency-name: ghcr.io/hyperformant/node-runtime
    # commit-message is group-only for multi-ecosystem entries (set below).
    labels:
      - dependencies

  # Compose files: the template's (shipped into every project), the add-on
  # services', and the ACME isolation harness. Same `images` PR as the
  # Dockerfiles and k8s manifests. A Traefik tag bump must also move the CRD
  # URL in carbon/k8s/base/traefik (tests/unit/template/traefik-crd-version.test.ts).
  - package-ecosystem: docker-compose
    directories:
      - /carbon
      - /services/*/compose
      - /scripts/acme-iso
    multi-ecosystem-group: images
    patterns: ["*"]
    ignore:
      # Our ghcr mirrors in docker-compose.prod.yml (see OUR GHCR MIRRORS).
      - dependency-name: ghcr.io/hyperformant/traefik
      - dependency-name: ghcr.io/hyperformant/docker-socket-proxy
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /.github/image-pins
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(docker-deps)
      include: scope
    labels:
      - dependencies
    groups:
      js-pins:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker/postgres-walg
    # A PostgreSQL major is a data-format change (dump/restore or
    # pg_upgrade), never a routine bump. Minors, digest moves and wal-g
    # re-pins still come through.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(docker-deps)
      include: scope
    labels:
      - dependencies
    groups:
      db-image:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker/node-runtime
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(docker-deps)
      include: scope
    labels:
      - dependencies
    groups:
      node-runtime:
        patterns: ["*"]

multi-ecosystem-groups:
  images:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    commit-message:
      prefix: chore(docker-deps)
      include: scope
