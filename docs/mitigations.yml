      around a failover, cert-manager's core DO solver keying records by
      NAME. The watchdog's bounded challenge bounce (delete → controller
      recreates → fresh Present) is the recovery; the self-check half
      (anycast POP staleness) is root-addressed by the
      --dns01-recursive-nameservers-only config in the same change.
    sites:
