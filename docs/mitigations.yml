# Every INFRA_PATTERNS reason in tests/e2e/utils/classify-failure.ts —
# i.e. everything eligible for the runner's E2E_RETRY_FLAKES auto-retry —
# maps to a class above. The census fails if a reason maps to an 'ours'
# class: our own defects must never auto-retry.
  - class: dns-anycast-propagation-divergence
    attribution: external-proven
    evidence: >-
      DigitalOcean authoritative DNS is anycast and its POPs converge minutes
      apart, in BOTH directions of the DNS-01 dance. Run 33266321881: lego's
      own propagation check against ns1-3.digitalocean.com failed past its
      60s window ("did not return the expected TXT record") while the API
      write had succeeded. Run 33283466928: with a SINGLE armed solver
      (acme-role.js single-active-issuer policy — our own dual-solver
      contribution root-fixed first), lego's 300s authoritative check
      PASSED and Let's Encrypt validation still answered "No TXT record
      found" — divergence between lego's vantage POP and the CA's.
      Mitigations: DO_PROPAGATION_TIMEOUT=300 plus a 90s
      propagation.delayBeforeChecks settle floor (dns-provider.js
      legoTuningEnv → docker-compose.dns01.prod.yml), giving each record
      wall-time in the zone before any validation is triggered. Residual
      misses are retried by E2E_RETRY_FLAKES via this mapping.
      2026-09-01: hetzner joined this class — its anycast NS showed the
      same divergence in degraded windows (twin records 20s vs 90s+,
      run 33341893276 probes) and post-timeout-only-fix dispatches
      (33435737752) failed on the vantage-divergence spellings, including
      LE's "During secondary validation:" prefix (remote perspectives
      only). Same mitigation pair applied to the hetzner legoTuningEnv row;
      harness-proven (split-shape trial, apex+wildcard at +123s with the
      90s floor).
    sites: []

  - class: vultr-dns-negative-cache-poisoning
    attribution: external-proven
    evidence: >-
      Direct probes on the threvidence.com zone, 2026-08-30 ~15:0x-15:3xZ:
      a TXT record created WITHOUT any prior query serves from
      ns1.vultr.com in <=5s (records d9a48ee6, c94211a5, 085779f2 —
      1-label, 2-label, and _acme-challenge.* names alike); the identical
      create preceded by ONE dig of the not-yet-existing name (record
      ef1dbe24, _acme-challenge.primed1788103268) stays invisible for 60s+
      — the authoritative frontend negatively caches the miss. lego at
      delayBeforeChecks=0 queries the instant it presents, poisoning its
      own challenge name; its 60s default window then starves against the
      cached miss ("NS ns1.vultr.com:53 returned NXDOMAIN", harness trials
      isov1050/isov4b51/isov5b51) or, with apex+wildcard orders sharing a
      name, the sibling's stale token (run 33287840597 vultr compose-ha).
      Mitigation: vultr legoTuningEnv (dns-provider.js) — 60s
      delayBeforeChecks floor so the first query lands after publication,
      VULTR_PROPAGATION_TIMEOUT=300 for cache-expiry stragglers on churned
      names. Residual misses retried by E2E_RETRY_FLAKES via this mapping.
    sites: []

  - class: supabase-boot-ddl-deadlock
    attribution: external-asserted
    evidence: >-
      Run 33287840597 (hetzner k8s-ha restore's re-deploy, 2026-08-30
      03:5xZ): applyMigrations' --single-transaction psql died with
      "ERROR: deadlock detected / Process 71 waits for AccessExclusiveLock
      on relation 16524 ... blocked by process 55" while applying policies
      on storage.objects — the relations supabase-storage's own first-boot
      DDL migrates concurrently. The storage-schema readiness probe
      (buckets.public queryable) proves schema EXISTENCE, not lock
      quiescence, and full serialization is circular: our migrations
      REQUIRE the services' boot DDL to have run. Deadlock retry is
      Postgres's documented contract for 40P01 (the file's transaction
      rolled back completely, so the re-run is byte-identical to attempt
      1); a failure surviving the ladder stays loudly fatal.
    proofDebtSpec: docs/attribution-ledger.md
    frozenSites: 3
    sites:
      - site: "src/lib/deploy/migration-deadlock.js :: MIGRATION_DEADLOCK_DELAYS_MS"
      - site: "src/lib/deploy/migration-deadlock.js :: MIGRATION_DEADLOCK_PATTERN"
        detectable: false
        notes: the 40P01 spelling gate — nothing but "deadlock detected" retries
      - site: "src/lib/deploy/migration-deadlock.js :: composeMigrationsRetryShell"
        detectable: false
        notes: >-
          the same ladder rendered as the compose transports' remote shell
          loop (attempt bound derived from MIGRATION_DEADLOCK_DELAYS_MS)

