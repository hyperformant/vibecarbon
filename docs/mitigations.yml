          maps the domain to the public-DNS-resolved IP (Host/SNI stay the
          domain) instead of sitting on the OS resolver
      - site: "tests/e2e/checks/supavisor-pooler.ts :: external dial resolveCheckIp"
        detectable: false
        notes: >-
          raw TCP dial has no Host/SNI to preserve; dials the
          public-DNS-resolved address with fallback to the name
      - site: "tests/e2e/runner.ts :: resolvectl flush-caches at scenario start"
        detectable: false
        notes: >-
          harness hygiene for the consumers that cannot be pinned
          (psql/openssl child processes); unprivileged, fail-open, clears
          only the LOCAL systemd-resolved layer — the router layer above it
          is why the pins exist

