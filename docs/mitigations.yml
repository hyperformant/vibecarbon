  - class: provider-host-failure
    attribution: external-proven
    evidence: >-
      A provisioned host going dark mid-deploy while the provider API still
      reports it running. 2026-09-01, e2e run 07ffb0d6-11ae-4db0-bbdc-d9cf73f91906
      (PG17 cert, hetzner k8s-ha standby worker
      testapp-k8s-ha-1788223963488-r9p4ie-e4-standby-supabase, hel1): node
      NotReady in k3s, kubelet unreachable from the
      master (proxy 502 dialing :10250), SSH to the public IP timed out
      during banner exchange, Hetzner Cloud API status "running"
      throughout — a kernel/host wedge, not anything the workload did. The
      db pod froze in Init and helm's --wait expired. Detection is
      evidence-gated: summarizeNotReadyNodes (k3s.js) appends the NotReady
      node clause to the helm-failure error, and the classifier requires
      BOTH the stuck-pod and NotReady-node clauses before attributing here
      — a stuck pod on healthy nodes stays [unknown] (ours until proven
      otherwise). Retry is the only remedy: the rebuilt deploy lands on a
      fresh host.
    sites: []

