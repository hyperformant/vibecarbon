# vibecarbon db: the server configuration baked into the image at
# /etc/postgresql/postgresql.conf. Every deploy mode starts postgres with
# `-c config_file=/etc/postgresql/postgresql.conf`, so this file REPLACES the
# postgresql.conf initdb writes into PGDATA (that one is never read).
#
# What lives here: settings that are true of every vibecarbon database, on
# every tier. What does NOT: the WAL and archiving settings (wal_level,
# archive_mode, archive_command, archive_timeout, hot_standby) and
# max_connections. Those are passed as `-c` flags by the deploy (compose's db
# `command:`), where they stay visible next to the backup env they depend on.
# Command-line flags win over this file.
#
# hba_file and data_directory are deliberately left at their defaults:
# PGDATA/pg_hba.conf and PGDATA. The official entrypoint writes the hba rules
# at first boot, and compose-ha resolves the live path with `SHOW hba_file`.

listen_addresses = '*'

# pg_cron runs the app's scheduled jobs (carbon/db/migrations/00003_pg_cron.sql)
# and must be preloaded: it starts a background worker at server start. Its
# metadata (the cron schema) lives in the one database the app uses.
shared_preload_libraries = 'pg_cron'
cron.database_name = 'postgres'

# Small-box defaults. A compose server shares its RAM with the app and Traefik,
# and 128MB of shared buffers is PostgreSQL's own default. Raise it on bigger
# servers. max_connections here is the fallback; the deploy passes its own.
shared_buffers = 128MB
max_connections = 100

# The settings initdb would otherwise have written into PGDATA's copy.
dynamic_shared_memory_type = posix
max_wal_size = 1GB
min_wal_size = 80MB
datestyle = 'iso, mdy'
timezone = 'Etc/UTC'
log_timezone = 'Etc/UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
