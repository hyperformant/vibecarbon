# vibecarbon db: the server configuration baked into the image at
# /etc/postgresql/postgresql.conf. Every deploy mode starts postgres with
# `-c config_file=/etc/postgresql/postgresql.conf`, so this file REPLACES the
# postgresql.conf initdb writes into PGDATA (that one is never read).
#
# What lives here: settings that are true of every vibecarbon database, on
# every tier. What does NOT: the WAL and archiving settings (wal_level,
# archive_mode, archive_command, archive_timeout, hot_standby) and
# max_connections. Those are passed as `-c` flags by the deploy (compose's db
# `command:`), where they stay visible next to the backup env they depend on.
# Command-line flags win over this file.
#
# hba_file and data_directory are deliberately left at their defaults:
# PGDATA/pg_hba.conf and PGDATA. The official entrypoint writes the hba rules
# at first boot, and compose-ha resolves the live path with `SHOW hba_file`.

listen_addresses = '*'

# pg_cron runs the app's scheduled jobs (carbon/db/migrations/0000_baseline_pre.sql
# creates the extension, 0002_baseline_post.sql the schedules) and must be
# preloaded: it starts a background worker at server start. Its metadata (the
# cron schema) lives in the one database the app uses.
#
# pg_stat_statements (contrib, shipped in the official image) records every
# query's call count and timing, so "why is my app slow" has an answer:
# `SELECT query, calls, total_exec_time FROM monitoring.pg_stat_statements
# ORDER BY total_exec_time DESC LIMIT 20` (as postgres). It must be preloaded
# too (shared memory), and the baseline creates it in the `monitoring` schema. 1000 statements is about 2 MB.
# track_utility is off so DDL and ALTER ROLE ... PASSWORD are never kept in
# its query text.
shared_preload_libraries = 'pg_cron,pg_stat_statements'
cron.database_name = 'postgres'
pg_stat_statements.max = 1000
pg_stat_statements.track_utility = off

# Slow statements (over 1 s) and lock waits (over deadlock_timeout, 1 s) go to
# the server log (`docker compose logs db`), with the statement text.
log_min_duration_statement = 1000
log_lock_waits = on

# Never write bind parameters to the log. The app sends every query with its
# values as parameters (node-postgres, extended protocol), and those values
# include session tokens, verification tokens, TOTP secrets and OAuth tokens.
# The default (-1) logs them in full with every slow statement, and a lock
# pile-up on `session` makes every session lookup slow. The log reaches Loki
# when the observability add-on is installed. The statement text, with its
# $n placeholders, is still logged. `_on_error` is PostgreSQL's default (0)
# too, set here so nobody raises it by accident.
#
# A failing statement's text is logged too (log_min_error_statement = error,
# the default), literals included. A session that sends a password as a
# literal (ALTER ROLE ... PASSWORD) runs `SET log_min_error_statement =
# panic` first: the init scripts and the documented rotation do.
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0

# Small-box defaults. A compose server shares its RAM with the app and Traefik,
# and 128MB of shared buffers is PostgreSQL's own default. Raise it on bigger
# servers. max_connections here is the fallback; the deploy passes its own.
shared_buffers = 128MB
max_connections = 100

# The settings initdb would otherwise have written into PGDATA's copy.
dynamic_shared_memory_type = posix
max_wal_size = 1GB
min_wal_size = 80MB
datestyle = 'iso, mdy'
timezone = 'Etc/UTC'
log_timezone = 'Etc/UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
